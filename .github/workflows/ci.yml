name: CI

on:
  pull_request:
    branches: [main, develop]

env:
  SOLUTION: "MediaHandler.slnx"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  HUSKY: 0 # skip git hook installation on CI runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1 – Restore · Build · Format check
  # Fast gate: fails immediately if the code doesn't compile or
  # violates the formatter. All downstream jobs wait for this one.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Format
    runs-on: ubuntu-latest

    steps:
      # git is pre-installed on ubuntu-latest runners.
      # github.head_ref is set for PRs; github.ref_name is used for direct pushes.
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 --branch "${{ github.head_ref || github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      # Local composite action – always allowed because it lives in this repo.
      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --no-restore

  # ──────────────────────────────────────────────────────────────
  # JOB 2 – Unit tests (no infrastructure required)
  # Runs in parallel with the integration-tests job.
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 --branch "${{ github.head_ref || github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MediaHandler.Tests/MediaHandler.Tests.csproj

      - name: Run unit tests
        run: >
          dotnet test --project MediaHandler.Tests/MediaHandler.Tests.csproj
          --configuration Release
          --results-directory ./test-results/unit
          -- --report-trx --report-trx-filename unit-results.trx
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results/unit

  # ──────────────────────────────────────────────────────────────
  # JOB 3 – Integration tests (Testcontainers → Docker required)
  # ubuntu-latest ships with Docker pre-installed.
  # No secrets needed: the test base spins up its own SQL Server
  # container via Testcontainers.MsSql.
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    env:
      # Disable the Ryuk cleanup container – not needed in ephemeral CI runners
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 --branch "${{ github.head_ref || github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MediaHandler.IntegrationTests/MediaHandler.IntegrationTests.csproj

      - name: Run integration tests
        run: >
          dotnet test --project MediaHandler.IntegrationTests/MediaHandler.IntegrationTests.csproj
          --configuration Release
          --results-directory ./test-results/integration
          -- --report-trx --report-trx-filename integration-results.trx
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./test-results/integration

  # ──────────────────────────────────────────────────────────────
  # JOB 4 – Security scan
  # Checks every NuGet package (direct + transitive) against the
  # GitHub Advisory Database via the NuGet vulnerability feed.
  # Fails the workflow if any known vulnerability is found.
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 --branch "${{ github.head_ref || github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected – please update the affected dependencies."
            exit 1
          fi
