name: Deploy API

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mediahandler-api
  DEPLOY_ENV_FILE: /srv/docker/mediahandler/deploy/.env
  DEPLOY_COMPOSE: /srv/docker/mediahandler/deploy/docker-compose.prod.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HUSKY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# GHCR requires packages:write to push images
permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 – Build Docker image and push to GHCR (GitHub-hosted runner)
  # ─────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push API image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build & push
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          docker build \
            --tag "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            --file MediaHandler.API/Dockerfile \
            .
          docker push "${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker push "${{ env.IMAGE_NAME }}:latest"
          echo "Pushed: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 – Deploy to server via self-hosted runner
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to jarvis
    runs-on: [self-hosted, jarvis]
    needs: build-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure deploy directory exists
        run: sudo mkdir -p /srv/docker/mediahandler/{db,api/logs,api/uploads,deploy}

      - name: Update compose file on server
        run: |
          cp deploy/docker-compose.prod.yml "${{ env.DEPLOY_COMPOSE }}"
          echo "Compose file updated"

      - name: Write .env from GitHub Secrets
        # Writes (or overwrites) the .env file from GitHub Secrets.
        # Single source of truth — no manual file management on the server.
        run: |
          cat > "${{ env.DEPLOY_ENV_FILE }}" <<EOF
          # Auto-generated by GitHub Actions — do not edit manually
          APP_HOST=${{ secrets.APP_HOST }}
          DATA_ROOT=/srv/docker/mediahandler
          GHCR_OWNER=${{ github.repository_owner }}
          IMAGE_TAG=${{ needs.build-push.outputs.image-tag }}
          DB_SA_PASSWORD=${{ secrets.DB_SA_PASSWORD }}
          OKTA_DOMAIN=${{ secrets.OKTA_DOMAIN }}
          OKTA_CLIENT_ID=${{ secrets.OKTA_CLIENT_ID }}
          OKTA_CLIENT_SECRET=${{ secrets.OKTA_CLIENT_SECRET }}
          OKTA_AUDIENCE=${{ secrets.OKTA_AUDIENCE }}
          TMDB_READ_ACCESS_TOKEN=${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          NAS_APP_ID=mediahandler
          NAS_APP_TOKEN=${{ secrets.NAS_APP_TOKEN }}
          NAS_BASE_PATH_0=${{ secrets.NAS_BASE_PATH_0 }}
          NAS_BASE_PATH_1=${{ secrets.NAS_BASE_PATH_1 }}
          NAS_FREEBOX_URL=${{ secrets.NAS_FREEBOX_URL || 'http://mafreebox.freebox.fr' }}
          EOF
          # Strip leading whitespace introduced by the heredoc indentation
          sed -i 's/^[[:space:]]*//' "${{ env.DEPLOY_ENV_FILE }}"
          chmod 600 "${{ env.DEPLOY_ENV_FILE }}"
          echo ".env written from GitHub Secrets ($(wc -l < "${{ env.DEPLOY_ENV_FILE }}") lines)"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Create Docker network (idempotent)
        run: docker network create mediahandler_net 2>/dev/null || true

      - name: Ensure DB is running
        run: |
          docker compose -p mediahandler \
            --env-file "${{ env.DEPLOY_ENV_FILE }}" \
            -f "${{ env.DEPLOY_COMPOSE }}" \
            up -d db
          echo "DB container ensured"

      - name: Pull & restart API
        run: |
          docker compose -p mediahandler \
            --env-file "${{ env.DEPLOY_ENV_FILE }}" \
            -f "${{ env.DEPLOY_COMPOSE }}" \
            pull api
          docker compose -p mediahandler \
            --env-file "${{ env.DEPLOY_ENV_FILE }}" \
            -f "${{ env.DEPLOY_COMPOSE }}" \
            up -d --no-deps api
          echo "API restarted"

      - name: Health check
        run: |
          echo "Waiting for API on :8080..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health check passed (attempt ${i})"
              exit 0
            fi
            echo "  attempt ${i}/30 — retrying in 5s"
            sleep 5
          done
          echo "::error::Health check failed after 150s"
          docker compose -p mediahandler \
            --env-file "${{ env.DEPLOY_ENV_FILE }}" \
            -f "${{ env.DEPLOY_COMPOSE }}" \
            logs api --tail 80
          exit 1

      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io || true
